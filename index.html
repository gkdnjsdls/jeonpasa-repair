<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가전 고치기</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e9914c">
<style>
/* Layout: 화면 가득 3D 작업대. 위 단계 아이콘 줄, 왼쪽 아래 기사님 말풍선(아이콘+한 줄), 오른쪽 위 손님 쪽지 */
:root{
  color-scheme: dark;
  --bg:#13222a; --panel:#1c2f36; --panel-2:#243c44; --line:#35525c;
  --ink:#eef3ef; --muted:#8fa6a2;
  --copper:#e9914c; --copper-ink:#2a1608;
  --paper:#f4ecd8; --paper-t:#f4ecd8d9; --paper-ink:#2b241a;
  --glow:#ffd84a; --ok:#5fe08f; --bad:#ff6f5c;
}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
svg.i{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.game{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{width:46px;height:46px;flex:none;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:9px}
.strip{flex:1;display:flex;gap:6px;overflow-x:auto;padding:4px 2px;min-width:0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{width:36px;height:36px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:7px;color:var(--muted);transition:transform .2s}
.st.done{color:var(--ok);background:#173a2a;border-color:#2b6a48}
.st.now{color:var(--copper-ink);background:var(--copper);border-color:var(--copper);transform:scale(1.15)}
.coin{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;flex:none}
.coin i{position:absolute;left:0;bottom:0;height:4px;background:var(--glow)}
.coin span{width:22px;height:22px;color:var(--glow)}
.coin b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--glow)}

.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:calc(100vh - 100px);min-height:380px;border-radius:16px;overflow:hidden;background:#0f1c22;border:1px solid var(--line)}
@media (max-width:640px){.stage{aspect-ratio:3/4}.game{min-height:100vh;align-content:center}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.mentor{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.mentor .face{width:70px;height:70px;flex:none}
.mentor.shake .face{animation:no .45s}
@keyframes no{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.bub{display:flex;align-items:center;gap:12px;background:var(--paper-t);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--paper-ink);border-radius:18px;padding:10px 16px 10px 10px;position:relative;margin-bottom:28px;box-shadow:0 4px 0 #0004;max-width:min(560px,100%);min-width:0}
.bub::before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--paper-t);border-left:0}
.bub .ico{width:52px;height:52px;flex:none;background:#2b241a;color:var(--paper);border-radius:14px;padding:10px}
.bub p{margin:0;font-size:17px;line-height:1.45;font-weight:600}
.bub.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.06)}}
.mentor.shake .bub{background:#ffd6cfd9}

.note{position:absolute;right:12px;top:12px;background:var(--paper-t);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--paper-ink);border-radius:14px;padding:8px 14px 8px 8px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 #0004;pointer-events:none;max-width:60%}
.note span{width:38px;height:38px;flex:none}
.note p{margin:0;font-weight:700;font-size:15px}

.beep{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;padding:32px;pointer-events:none;animation:pop .4s}
.beep.yes{background:var(--ok);color:#0b2a17;box-shadow:0 0 0 14px #5fe08f44}
.beep.no{background:#46555b;color:#e8eef0}

.over{position:absolute;inset:0;background:#0b161be6;display:grid;place-items:center;padding:16px;z-index:5;overflow:auto}
.menu{width:min(920px,100%);display:grid;gap:14px}
.mhead{display:flex;align-items:center;gap:12px}
.goal{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.goal .ic{width:34px;height:34px;flex:none;color:var(--glow)}
.goal .gbar{flex:1;height:10px;border-radius:5px;background:#0004;overflow:hidden;min-width:60px}
.goal .gbar i{display:block;height:100%;background:var(--glow)}
.goal b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--glow);flex:none}
.mhead h2{margin:0;font-size:24px}
.mhead .ic{width:40px;height:40px;color:var(--copper)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 12px 14px;display:grid;justify-items:center;gap:8px;text-align:center;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--copper)}
.card.locked{opacity:.5;cursor:not-allowed}
.card.locked:hover{transform:none;border-color:var(--line)}
.card .big{width:80px;height:80px;color:#3fb6a8}
.card.locked .big{color:var(--muted)}
.card b{font-size:17px}
.card small{color:var(--muted);font-size:13px}
.card .num{position:absolute;left:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--copper);color:var(--copper-ink);display:grid;place-items:center;font-size:18px;font-weight:800}
.card .ok{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#0b2a17;padding:6px}
.card.stage-card{padding-top:52px;min-height:150px;align-content:start}
.card.stage-card .sico{width:46px;height:46px;color:var(--copper)}
.bar{width:80%;height:6px;border-radius:3px;background:#0004;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

.win{display:grid;justify-items:center;gap:14px;text-align:center}
.win .bigok{width:120px;height:120px;border-radius:50%;background:var(--ok);color:#0b2a17;padding:24px;animation:pop .5s}
.win .cause{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:10px 16px;font-weight:700;font-size:17px}
.win .grade{background:var(--glow);color:#3a2c05;border-radius:12px;padding:6px 16px;font-weight:800;font-size:15px}
.win .pay{display:flex;align-items:center;gap:8px;font-size:32px;font-weight:800;color:var(--glow)}
.win .pay span{width:38px;height:38px}
.row{display:flex;gap:12px}
.bigbtn{width:70px;height:70px;border-radius:20px;background:var(--panel-2);border:2px solid var(--line);padding:16px}
.bigbtn.go{background:var(--copper);color:var(--copper-ink);border-color:var(--copper)}

.solder{display:grid;justify-items:center;gap:16px;width:min(420px,100%);text-align:center}
.solder .tool{width:80px;height:80px;color:var(--copper)}
.solder p{margin:0;font-weight:600}
.heat{position:relative;width:100%;height:30px;border-radius:15px;background:#0c1a1f;border:2px solid var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#5fe08f66;border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4f6b75,#e8a04c 70%,#ff5a3c)}
.hold{width:116px;height:116px;border-radius:50%;background:var(--copper);color:var(--copper-ink);padding:28px;box-shadow:0 8px 0 #8a4f22;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .08s,box-shadow .08s}
.hold.active{transform:translateY(6px);box-shadow:0 2px 0 #8a4f22;background:#ffb070}
.sres{width:52px;height:52px;border-radius:50%;padding:11px}
.sres.ok{background:var(--ok);color:#0b2a17}
.sres.bad{background:var(--bad);color:#2a0b06;animation:no .4s}

.diagbox{display:grid;gap:12px;width:min(380px,100%)}
.opts{display:grid;gap:10px}
.opt{background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:17px;font-weight:700;text-align:center;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:not-allowed}
.opt.wrong{opacity:.35;text-decoration:line-through;border-color:var(--bad);animation:no .4s}
.opt.hint{border-color:var(--ok);box-shadow:0 0 0 3px #5fe08f55}
.hintbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--glow);font-weight:700}
.hintbtn span{width:22px;height:22px;flex:none}
.hintbtn:disabled{opacity:.4;cursor:not-allowed}
.nogl{display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;text-align:center}
@media (prefers-reduced-motion:reduce){.bub.pop,.beep,.win .bigok,.mentor.shake .face{animation:none}}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <button class="iconbtn" id="homeBtn" type="button" aria-label="물건 고르기"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></button>
    <button class="iconbtn" id="sndBtn" type="button" aria-label="소리 켜기/끄기"></button>
    <div class="strip" id="strip" aria-label="수리 순서"></div>
    <div class="coin" aria-label="번 돈"><span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9l2 7 2-5 2 5 2-7M7 12h10"/></svg></span><b id="money">0</b><i id="moneyBar"></i></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="note" id="note"></div>
    <div class="mentor" id="mentor">
      <svg class="face" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="35" r="23" fill="#f1c9a0"/>
        <path d="M9 31c0-14 10-22 23-22s23 8 23 22z" fill="#2f6fb5"/><rect x="7" y="28" width="38" height="6" rx="3" fill="#24558c"/>
        <circle cx="24" cy="39" r="2.6" fill="#2b241a"/><circle cx="40" cy="39" r="2.6" fill="#2b241a"/>
        <path d="M24 47q8 6 16 0" stroke="#2b241a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="bub" id="bub" aria-live="polite"><span class="ico" id="bubIco"></span><p id="bubTxt"></p></div>
    </div>
    <div class="beep" id="beep" hidden></div>

    <div class="over" id="menu"><div class="menu" id="menuIn"></div></div>

    <div class="over" id="win" hidden>
      <div class="win">
        <div class="bigok"><svg class="i" viewBox="0 0 24 24" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
        <div class="cause" id="winCause"></div>
        <div class="grade" id="winGrade" hidden></div>
        <div class="grade" id="winShop" hidden></div>
        <div class="pay"><span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9l2 7 2-5 2 5 2-7M7 12h10"/></svg></span><b id="winPay"></b></div>
        <div class="row">
          <button class="bigbtn" id="winHome" type="button" aria-label="단계 목록"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <button class="bigbtn go" id="winNext" type="button" aria-label="다음 단계"><svg class="i" viewBox="0 0 24 24" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>

    <div class="over" id="solder" hidden>
      <div class="solder">
        <div class="tool" id="sdTool"></div>
        <p>꾹 누르다가 초록 칸에서 손을 떼요</p>
        <div class="heat"><div class="zone" id="sdZone"></div><div class="fill" id="sdFill"></div></div>
        <div class="sres" id="sdRes" hidden></div>
        <button class="hold" id="sdHold" type="button" aria-label="꾹 누르기"><svg class="i" viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 013 0v6M11 11V4a1.5 1.5 0 013 0v7M14 11V5a1.5 1.5 0 013 0v8c0 4-2 7-6 7s-6-2-7-5l-1.5-3a1.4 1.4 0 012.4-1.4L8 13"/></svg></button>
      </div>
    </div>

    <div class="over" id="diag" hidden>
      <div class="diagbox">
        <div class="opts" id="diagOpts"></div>
        <button class="hintbtn" id="diagHintBtn" type="button"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const PI=Math.PI;

/* ================= icons ================= */
const IC={
  plugOut:'<path d="M4 9h7v7H4z"/><path d="M6 9V5M9 9V5M7.5 16v4"/><path d="M14 12.5h7M18 9.5l3 3-3 3"/>',
  plugIn:'<path d="M13 9h7v7h-7z"/><path d="M15 9V5M18 9V5M16.5 16v4"/><path d="M3 12.5h7M7 9.5l3 3-3 3"/>',
  driver:'<path d="M14 3l7 7-3 3-7-7z"/><path d="M11 6l-7 7a2 2 0 000 3l1 1a2 2 0 003 0l7-7"/>',
  lift:'<path d="M12 20V8M7 12l5-5 5 5"/><path d="M4 4h16"/>',
  down:'<path d="M12 4v12M7 12l5 5 5-5"/><path d="M4 20h16"/>',
  hand:'<path d="M8 13V5a1.5 1.5 0 013 0v6M11 11V4a1.5 1.5 0 013 0v7M14 11V5a1.5 1.5 0 013 0v8c0 4-2 7-6 7s-6-2-7-5l-1.5-3a1.4 1.4 0 012.4-1.4L8 13"/>',
  tester:'<rect x="6" y="2" width="12" height="13" rx="2"/><path d="M9 6h6M9 9h3"/><path d="M9 15l-3 7M15 15l3 7"/>',
  look:'<circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L21 21"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>',
  box:'<path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/>',
  iron:'<path d="M2 22l5-5"/><path d="M7 17l3-3 4 4-3 3z"/><path d="M12 12l6-6a2.1 2.1 0 013 3l-6 6"/>',
  power:'<path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1011.4 0"/>',
  pick:'<path d="M6 3l6 13M18 3l-6 13M12 16v5"/>',
  spin:'<path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/>',
  brush:'<path d="M14 4l6 6-8 8-6-6z"/><path d="M6 12l-3 3 6 6 3-3"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8L20 18M8.5 16L20 6"/>',
  strip:'<path d="M3 12h9"/><path d="M12 9h3v6h-3z"/><path d="M15 12h6" stroke-dasharray="2 2"/>',
  drop:'<path d="M12 3c3 5 6 8 6 12a6 6 0 01-12 0c0-4 3-7 6-12z"/>',
  clip:'<rect x="5" y="4" width="14" height="16" rx="3"/><path d="M9 4v6h6V4"/>',
  dryer:'<path d="M2 6h13a4.5 4.5 0 010 9H9.5l1.2 6H6.5L5.5 15H2z"/><path d="M19.5 8v5"/>',
  fan:'<circle cx="12" cy="9" r="7"/><path d="M12 9l-3-5M12 9l5 2M12 9l-3 5M12 16v5M8 21h8"/>',
  kettle:'<path d="M6 8h11l1 12H5z"/><path d="M17 10c3 0 3 7 0 7M6 10L3 8M8 8V6h7v2"/>',
  rice:'<path d="M4 10h16v8a3 3 0 01-3 3H7a3 3 0 01-3-3z"/><path d="M3 10c1-4 5-6 9-6s8 2 9 6"/><path d="M9 14h6"/>',
  remote:'<rect x="8" y="2" width="8" height="20" rx="3"/><circle cx="12" cy="6" r="1.2"/><path d="M10.5 11h3M10.5 14h3M10.5 17h3"/>',
  microwave:'<rect x="2" y="4" width="20" height="16" rx="2"/><rect x="4.5" y="7" width="11" height="10" rx="1"/><circle cx="19" cy="9" r=".6"/><circle cx="19" cy="12" r=".6"/><path d="M17 15.5h4"/>',
  toaster:'<rect x="3" y="9" width="16" height="11" rx="2"/><path d="M7 9V5M12 9V5"/><rect x="18.5" y="12" width="3" height="5" rx="1"/>',
  vacuum:'<path d="M12 2v9"/><circle cx="12" cy="2" r="1.2"/><path d="M7 20h10l-1.2-7H8.2z"/><circle cx="9" cy="20.5" r="1.3"/><circle cx="15" cy="20.5" r="1.3"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="6" r="1.5"/>',
  back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  beep:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 9a4 4 0 010 6M18.5 6a8 8 0 010 12"/>',
  mute:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/>',
  no:'<path d="M6 6l12 12M18 6L6 18"/>',
  warn:'<path d="M12 3l9 17H3z"/><path d="M12 10v4M12 17v.5"/>',
  shop:'<path d="M3 9l2-5h14l2 5z"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.5a2.8 2.8 0 115.2 1.5c-.6.9-1.4 1.3-1.9 2.1-.3.5-.3 1-.3 1.4"/><path d="M12 17.5v.01"/>',
};
const svg=(k,sw)=>`<svg class="i" viewBox="0 0 24 24"${sw?` stroke-width="${sw}"`:''}>${IC[k]}</svg>`;

/* ================= save ================= */
const KEY='jeonpasa-3d-v2';
const P={money:0,done:[]};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){P.money=d.money||0;P.done=d.done||[];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
/* 돈은 쓰는 게 아니라 모으는 목표. 전 단계 첫 수리 보상 합계가 약 65만원이라 가게 열기를 60만원에 둠 */
const GOALS=[{at:150000,ic:'driver',n:'공구 선반'},{at:350000,ic:'look',n:'창문'},{at:600000,ic:'shop',n:'가게 간판'}];
const GOAL=GOALS[GOALS.length-1].at;
function showMoney(){
  $('#money').textContent=P.money.toLocaleString('ko-KR');
  $('#moneyBar').style.width=Math.min(1,P.money/GOAL)*100+'%';
  applyShop();
}

let AC=null;
function tone(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.06;g.gain.setTargetAtTime(0,AC.currentTime+d*.7,d*.2);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

/* 작업실 잡음(선풍기 도는 소리 느낌) — 라이선스 음원 없이 브라운 노이즈를 직접 합성해서 루프 */
let sndOn=true;try{sndOn=localStorage.getItem('jeonpasa-snd')!=='0';}catch(e){}
let ambGain=null;
function startAmbient(){
  if(ambGain)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    AC.resume&&AC.resume();
    const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);

/* ================= tweens & movement ================= */
const tweens=[];
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done});}
function tweenLocal(o,pos,dur,done){const p0=o.position.clone();tween(dur,e=>o.position.lerpVectors(p0,pos,e),done);}
function tweenWorld(o,p1,q1,dur,done,s1){const p0=o.position.clone(),q0=o.quaternion.clone(),s0=o.scale.x;
  tween(dur,e=>{o.position.lerpVectors(p0,p1,e);o.quaternion.copy(q0).slerp(q1,e);if(s1!=null)o.scale.setScalar(s0+(s1-s0)*e);},done);}
function awayObj(o,p,eu,dur,done){
  buzz(50);
  o.userData.ret={parent:o.parent,p:o.position.clone(),q:o.quaternion.clone()};scene.attach(o);
  tweenWorld(o,V(p[0],p[1],p[2]),new W.Quaternion().setFromEuler(new W.Euler(eu[0],eu[1],eu[2])),dur,done);
}
function returnObj(o,dur,done){
  buzz(40);
  const h=o.userData.ret;h.parent.updateMatrixWorld(true);
  const wp=h.parent.localToWorld(h.p.clone()),pq=new W.Quaternion();h.parent.getWorldQuaternion(pq);
  tweenWorld(o,wp,pq.multiply(h.q),dur,()=>{h.parent.attach(o);o.position.copy(h.p);o.quaternion.copy(h.q);done&&done();});
}
let camKey=null;
function camTo(k,done){
  if(camKey===k||!D.cams[k]){done&&done();return;}camKey=k;
  const c=D.cams[k],p1=V(...c[0]),t1=V(...c[1]),p0=camera.position.clone(),t0=controls.target.clone();
  tween(.9,e=>{camera.position.lerpVectors(p0,p1,e);controls.target.lerpVectors(t0,t1,e);},done);
}
function screwOut(id,done){
  const s=D.screws[id],h=s.userData.home,dir=s.userData.dir,r0=s.userData.inner.rotation.y;tone(420,.25,'triangle',.04);buzz(60);
  tween(.55,e=>{s.position.copy(h).addScaledVector(dir,.5*e);s.userData.inner.rotation.y=r0+e*14;},()=>{s.visible=false;done();});
}
function screwIn(id,done){
  const s=D.screws[id],h=s.userData.home,dir=s.userData.dir,r0=s.userData.inner.rotation.y;s.visible=true;tone(380,.25,'triangle',.04);buzz(60);
  tween(.55,e=>{s.position.copy(h).addScaledVector(dir,.5*(1-e));s.userData.inner.rotation.y=r0-e*14;},done);
}
function trashSlot(key,done){
  const o=D.obj[key];scene.attach(o);const p=o.position.clone().add(V(-.6,2.2,.8));buzz(50);
  tweenWorld(o,p,o.quaternion.clone(),.8,()=>{o.visible=false;scene.remove(o);D.obj[key]=null;done();},.5);
}
function insertSlot(key,done){
  const s=D.slots[key],o=s.make('new');boxContent.visible=false;
  const wp=boxG.localToWorld(V(0,.4,0));o.position.copy(wp);o.scale.setScalar(.4);scene.add(o);
  s.parent.updateMatrixWorld(true);
  const tp=s.parent.localToWorld(V(s.p[0],s.p[1],s.p[2])),pq=new W.Quaternion();s.parent.getWorldQuaternion(pq);
  const tq=pq.multiply(new W.Quaternion().setFromEuler(new W.Euler(s.r[0],s.r[1],s.r[2])));
  tweenWorld(o,tp,tq,1,()=>{s.parent.attach(o);o.position.set(s.p[0],s.p[1],s.p[2]);o.rotation.set(s.r[0],s.r[1],s.r[2]);o.scale.setScalar(1);D.obj[key]=o;tone(700,.08);buzz(40);done();},1);
}
function pourFromBox(target,done){
  const b=boxContent.children[0];if(!b){done();return;}
  awayObj(b,target,[0,0,0],.8,()=>{const q0=b.quaternion.clone(),q1=new W.Quaternion().setFromEuler(new W.Euler(0,0,2.0));
    tween(.5,e=>b.quaternion.copy(q0).slerp(q1,e),()=>{tone(900,.15,'sine',.04);buzz(40);setTimeout(()=>returnObj(b,.8,done),350);});});
}

const G={mk:null,n:0,steps:null,i:0,pend:null,probes:[],scrub:0,busy:true,on:false,diagWrong:0,diagHint:false,diagGrade:null};
function fillBox(kind){
  while(boxContent.children.length)boxContent.remove(boxContent.children[0]);
  boxContent.visible=!!kind;if(!kind)return;
  let o;
  if(kind==='oil')o=bottle('#e8c34a');
  else if(kind==='vinegar')o=bottle('#e8f0f2');
  else{const keep=Object.assign({},anchors);o=D.slots[kind].make('new');anchors=keep;
    const sc={heater:.4,motor:.7,fuse:1.3,cap:1.2,mfuse:1.3,blade:.35,disc:1.2,swmod:1.3,rfuse:1.3,gasket:.35,xtal:2,bat:.8,mwsw:1.3,mwfuse:1.3,mag:.8,tfuse:1.3,latch:1.2,theater:.9,vfuse:1.3}[kind]||1;o.scale.setScalar(sc);}
  o.traverse(m=>{if(m.isMesh){m.userData.id='box';pick.push(m);}});
  boxContent.add(o);
}
function startStage(mk,n){
  if(D){scene.remove(D.root);}
  pick=ENV_PICK.slice();anchors=Object.assign({},ENV_ANCH);
  G.mk=mk;G.n=n;const st=MACH[mk].stages[n];
  MACH[mk].build(st.cfg);
  fillBox(st.box);
  plug.position.copy(PLUG_IN.p);plug.quaternion.copy(PLUG_IN.q);
  G.steps=st.steps;G.i=0;G.on=false;G.busy=false;G.diagGrade=null;tweens.length=0;
  parts.forEach(p=>{p.life=0;p.m.visible=false;});
  $('#note').innerHTML=`<span>${svg(MACH[mk].icon)}</span><p></p>`;$('#note p').textContent='“'+st.title+'”';
  $('#menu').hidden=true;$('#win').hidden=true;
  camKey=null;const c=D.cams.home;camera.position.set(...c[0]);controls.target.set(...c[1]);camKey='home';
  setupStep();
}
function setupStep(){
  const st=G.steps[G.i];G.probes=[];G.scrub=0;probeR.visible=probeB.visible=false;
  G.pend=st.act==='multi'?new Set(st.ids):null;tester.visible=st.act==='tester';
  renderHud();
  if(st.cam&&st.cam!==camKey){G.busy=true;camTo(st.cam,()=>{G.busy=false;if(st.act==='diagnose')openDiag(st.diag);});}
  else if(st.act==='diagnose')openDiag(st.diag);
}
let curDiag=null;
function openDiag(diag){
  curDiag=diag;G.diagWrong=0;G.diagHint=false;
  const opts=diag.choices.slice().sort(()=>Math.random()-.5);
  $('#diagOpts').innerHTML=opts.map(c=>`<button class="opt" type="button" data-c="${c}">${c}</button>`).join('');
  $('#diagOpts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>diagPick(b.dataset.c,b));
  updateHintBtn();
  $('#diag').hidden=false;
}
function updateHintBtn(){
  const b=$('#diagHintBtn');
  b.innerHTML=`<span>${svg('q')}</span>힌트 보기 (${DIAG_COST.toLocaleString('ko-KR')}원)`;
  b.disabled=G.diagHint||P.money<DIAG_COST;
  b.onclick=diagHint;
}
function diagHint(){
  if(G.diagHint||P.money<DIAG_COST)return;
  P.money-=DIAG_COST;save();showMoney();G.diagHint=true;tone(900,.15);buzz(40);
  $('#diagOpts').querySelectorAll('.opt').forEach(b=>{if(b.dataset.c===curDiag.correct)b.classList.add('hint');});
  updateHintBtn();
}
function diagPick(c,btn){
  if(G.busy)return;
  if(c===curDiag.correct){
    const tries=G.diagWrong+1;G.diagGrade=G.diagHint?'B':(tries===1?'S':tries===2?'A':'B');
    tone(1200,.15);buzz(30);$('#diag').hidden=true;G.busy=false;next();
  }else{
    G.diagWrong++;btn.classList.add('wrong');btn.disabled=true;tone(150,.2,'square',.04);buzz(80);nudge();
  }
}
function activeIds(){
  if(G.busy||!G.steps||!G.steps[G.i])return[];
  const st=G.steps[G.i];
  if(st.act==='multi')return[...G.pend];
  if(st.act==='tester')return[st.ids[G.probes.length]];
  return st.ids;
}
function renderHud(){
  $('#strip').innerHTML=G.steps.map((s,k)=>`<div class="st ${k<G.i?'done':k===G.i?'now':''}">${svg(k<G.i?'check':s.ic,k<G.i?3:2)}</div>`).join('');
  const strip=$('#strip'),now=strip.children[G.i];if(now)strip.scrollLeft=now.offsetLeft-strip.offsetLeft-strip.clientWidth/2+now.clientWidth/2;
  const st=G.steps[G.i];
  $('#bubIco').innerHTML=svg(st?st.ic:'check',st?2:3);$('#bubTxt').textContent=st?st.say:'다 고쳤어요!';
  const b=$('#bub');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
}
function nudge(){const m=$('#mentor');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');tone(160,.18,'square',.04);}
function next(){G.i++;if(G.i>=G.steps.length){finish();return;}tone(660,.06);setupStep();}
function handle(id){
  if(G.busy)return;const act=activeIds();
  if(!id||!act.includes(id)){nudge();return;}
  const st=G.steps[G.i];
  if(st.act==='tap'){G.busy=true;st.run(()=>{G.busy=false;next();});}
  else if(st.act==='multi'){G.busy=true;G.pend.delete(id);st.run1(id,()=>{G.busy=false;if(!G.pend.size)next();});}
  else if(st.act==='tester'){
    const a=anchors[id].getWorldPosition(V(0,0,0)),pr=G.probes.length?probeB:probeR;
    pr.position.copy(a).add(V(0,.16,0));pr.rotation.set(PI,0,0);pr.visible=true;G.probes.push(id);tone(800,.04);buzz(20);
    if(G.probes.length===2){G.busy=true;setTimeout(()=>{
      const bp=$('#beep');bp.hidden=false;bp.className='beep '+(st.beep?'yes':'no');bp.innerHTML=svg(st.beep?'beep':'mute',2.4);
      if(st.beep)tone(2600,.7,'square',.05);else tone(120,.15,'sine',.03);
      setTimeout(()=>{bp.hidden=true;G.busy=false;next();},1500);},350);}
  }
  else if(st.act==='scrub'){
    G.scrub++;const m=D.dirt[id];tone(300+G.scrub*70,.06,'triangle',.04);buzz(20);
    m.material.opacity=m.userData.op0*(1-G.scrub/st.n);
    if(G.scrub>=st.n){m.visible=false;next();}
  }
  else if(st.act==='solder'){G.busy=true;solder(()=>{st.run(()=>{G.busy=false;next();});});}
}
function finish(){
  G.busy=true;renderHud();
  const st=MACH[G.mk].stages[G.n],key=G.mk+'-'+G.n,first=!P.done.includes(key);
  const fee=12000+G.n*1500,pay=first?fee:Math.round(fee/2);
  const was=P.money;P.money+=pay;if(first)P.done.push(key);save();showMoney();
  const hit=GOALS.find(g=>was<g.at&&P.money>=g.at);
  tone(880,.15);setTimeout(()=>tone(1320,.25),160);buzz([40,60,40]);
  setTimeout(()=>{
    $('#winCause').textContent=st.cause;$('#winPay').textContent='+'+pay.toLocaleString('ko-KR');
    if(G.diagGrade){$('#winGrade').hidden=false;$('#winGrade').textContent='진단 등급 '+G.diagGrade;}else{$('#winGrade').hidden=true;}
    $('#winShop').hidden=!hit;if(hit)$('#winShop').textContent=hit.n+' 생겼어요!';
    $('#winNext').hidden=G.n>=MACH[G.mk].stages.length-1;$('#win').hidden=false;
  },700);
}

function doneCount(k){return MACH[k].stages.filter((_,i)=>P.done.includes(k+'-'+i)).length;}
function isUnlocked(k){const i=MKEYS.indexOf(k);return i<=0||doneCount(MKEYS[i-1])>=2;}
function menuMachines(){
  G.busy=true;$('#win').hidden=true;$('#menu').hidden=false;
  const left=Math.max(0,GOAL-P.money);

  MKEYS.forEach(k=>{

const SD={on:false,hold:false,heat:0,z0:42,z1:78,cb:null,last:0,lock:false};
$('#sdTool').innerHTML=svg('iron',1.6);
function solder(cb){Object.assign(SD,{on:true,hold:false,heat:0,cb,lock:false});
  $('#sdZone').style.left=SD.z0+'%';$('#sdZone').style.width=(SD.z1-SD.z0)+'%';$('#sdRes').hidden=true;
  $('#solder').hidden=false;SD.last=performance.now();requestAnimationFrame(sdTick);}
function sdTick(t){if(!SD.on)return;const dt=t-SD.last;SD.last=t;
  if(SD.hold){SD.heat=Math.min(100,SD.heat+dt/26);if(SD.heat>=100)sdRelease();}
  $('#sdFill').style.width=SD.heat+'%';$('#sdHold').classList.toggle('active',SD.hold);requestAnimationFrame(sdTick);}
function sdPress(){if(SD.on&&!SD.lock){SD.hold=true;$('#sdRes').hidden=true;}}
function sdRelease(){
  if(!SD.on||!SD.hold)return;SD.hold=false;const h=SD.heat,r=$('#sdRes');r.hidden=false;
  if(h>=SD.z0&&h<=SD.z1){r.className='sres ok';r.innerHTML=svg('check',3);SD.lock=true;tone(1200,.1);buzz(60);
    setTimeout(()=>{SD.on=false;$('#solder').hidden=true;const c=SD.cb;SD.cb=null;c&&c();},700);}
  else{r.className='sres bad';r.innerHTML=svg('no',3);tone(150,.2,'square',.04);buzz(30);SD.heat=0;}
}
const hb=$('#sdHold');
hb.addEventListener('pointerdown',e=>{e.preventDefault();hb.setPointerCapture&&hb.setPointerCapture(e.pointerId);sdPress();});
hb.addEventListener('pointerup',sdRelease);hb.addEventListener('pointercancel',sdRelease);
hb.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(!$('#solder').hidden&&e.code==='Space'){e.preventDefault();if(!e.repeat)sdPress();}});
document.addEventListener('keyup',e=>{if(!$('#solder').hidden&&e.code==='Space'){e.preventDefault();sdRelease();}});

/* ================= picking ================= */
const ray=new W.Raycaster(),ndc=new W.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>7)return;
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pick.filter(live),false),act=activeIds();
  const h=hits.find(x=>act.includes(x.object.userData.id))||hits[0];
  handle(h?h.object.userData.id:null);
});

/* ================= loop ================= */
function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const clock=new W.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(ease(k));if(k>=1){tweens.splice(i,1);tw.done&&tw.done();}}
  updateCord();
  const act=activeIds(),k=.22+.22*Math.sin(t*6);
  pick.forEach(m=>{const mt=m.material;if(mt&&mt.emissive&&m.userData.id!==undefined){if(act.includes(m.userData.id))mt.emissive.setRGB(k*1.1,k*.85,0);else if(!mt.userData.keepE)mt.emissive.setRGB(0,0,0);}});
  if(act.length&&anchors[act[0]]){arrow.visible=true;const a=anchors[act[0]].getWorldPosition(V(0,0,0));arrow.position.set(a.x,a.y+.42+Math.sin(t*5)*.08,a.z);}
  else arrow.visible=false;
  if(G.on&&D){
    if(D.spin)D.spin(dt);
    const E=D.emit;
    parts.forEach(p=>{
      if(p.life<=0&&Math.random()<.3){p.life=.9;p.m.visible=true;
        p.m.position.set(E.p.x+(Math.random()-.5)*E.spread*(E.dir.x?0:1),E.p.y+(Math.random()-.5)*E.spread*(E.dir.y>.9?0:1),E.p.z+(Math.random()-.5)*E.spread*(E.dir.z?0:1));
        p.v.copy(E.dir).multiplyScalar(E.speed*(.8+Math.random()*.5)).add(V((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5));
        p.m.material.color.set(E.colors[Math.random()<.5?0:1]);}
      if(p.life>0){p.life-=dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.life)*.9;p.m.scale.setScalar(1+(.9-p.life)*(E.grow||2));if(p.life<=0)p.m.visible=false;}
    });
  }
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}
resize();showMoney();startStage('dryer',0);menuMachines();
loop();
})();
</script>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
