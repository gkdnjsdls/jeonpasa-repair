<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전파사 수리대</title>
<style>
/* Layout: 화면 가득 3D 작업대. 위에는 단계 아이콘 줄, 왼쪽 아래 기사님, 오른쪽 위 손님 쪽지(그림) */
:root{
  color-scheme: dark;
  --bg:#13222a; --panel:#1c2f36; --panel-2:#243c44; --line:#35525c;
  --ink:#eef3ef; --muted:#8fa6a2;
  --copper:#e9914c; --copper-ink:#2a1608;
  --paper:#f4ecd8; --paper-ink:#2b241a;
  --glow:#ffd84a; --ok:#5fe08f; --bad:#ff6f5c;
}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
svg.i{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.game{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{width:46px;height:46px;flex:none;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:9px}
.strip{flex:1;display:flex;gap:6px;overflow-x:auto;padding:4px 2px;min-width:0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{width:38px;height:38px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:7px;color:var(--muted);position:relative;transition:transform .2s}
.st.done{color:var(--ok);background:#173a2a;border-color:#2b6a48}
.st.now{color:var(--copper-ink);background:var(--copper);border-color:var(--copper);transform:scale(1.15)}
.coin{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;flex:none}
.coin span{width:22px;height:22px;color:var(--glow)}
.coin b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--glow)}

.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:calc(100vh - 100px);min-height:360px;border-radius:16px;overflow:hidden;background:#0f1c22;border:1px solid var(--line)}
@media (max-width:640px){.stage{aspect-ratio:3/4}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.mentor{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.mentor .face{width:76px;height:76px}
.mentor.shake .face{animation:no .45s}
@keyframes no{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.bub{width:84px;height:84px;background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:16px;position:relative;margin-bottom:34px;box-shadow:0 4px 0 #0004}
.bub::before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.bub.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.mentor.shake .bub{background:#ffd6cf}

.note{position:absolute;right:12px;top:12px;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:10px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 0 #0004;pointer-events:none}
.note span{width:44px;height:44px;display:block}

.beep{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;padding:34px;pointer-events:none;animation:pop .4s}
.beep.yes{background:var(--ok);color:#0b2a17;box-shadow:0 0 0 14px #5fe08f44}
.beep.no{background:#46555b;color:#e8eef0}

/* overlays */
.over{position:absolute;inset:0;background:#0b161bdd;display:grid;place-items:center;padding:16px;z-index:5;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:min(900px,100%)}
.card{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px 12px 14px;display:grid;justify-items:center;gap:10px;transition:transform .15s,border-color .15s}
.card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--copper)}
.card:disabled{opacity:.4;cursor:default}
.card .big{width:84px;height:84px;color:#3fb6a8}
.card .num{position:absolute;left:12px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--copper);color:var(--copper-ink);display:grid;place-items:center;font-size:22px;font-weight:800}
.card .sym{display:flex;gap:4px;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:6px 8px}
.card .sym span{width:30px;height:30px}
.card .ok{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--ok);color:#0b2a17;padding:6px}
.card .lock{width:34px;height:34px;color:var(--muted)}

.win{display:grid;justify-items:center;gap:16px;text-align:center}
.win .bigok{width:130px;height:130px;border-radius:50%;background:var(--ok);color:#0b2a17;padding:26px;animation:pop .5s}
.win .pay{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:800;color:var(--glow)}
.win .pay span{width:40px;height:40px}
.win .cause{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:10px 16px}
.win .cause span{width:46px;height:46px}
.row{display:flex;gap:12px}
.bigbtn{width:72px;height:72px;border-radius:20px;background:var(--panel-2);border:2px solid var(--line);padding:16px}
.bigbtn.go{background:var(--copper);color:var(--copper-ink);border-color:var(--copper)}

.solder{display:grid;justify-items:center;gap:18px;width:min(420px,100%)}
.solder .tool{width:90px;height:90px;color:var(--copper)}
.heat{position:relative;width:100%;height:30px;border-radius:15px;background:#0c1a1f;border:2px solid var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#5fe08f66;border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4f6b75,#e8a04c 70%,#ff5a3c)}
.hold{width:120px;height:120px;border-radius:50%;background:var(--copper);color:var(--copper-ink);padding:28px;box-shadow:0 8px 0 #8a4f22;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .08s,box-shadow .08s}
.hold.active{transform:translateY(6px);box-shadow:0 2px 0 #8a4f22;background:#ffb070}
.sres{width:56px;height:56px;border-radius:50%;padding:12px}
.sres.ok{background:var(--ok);color:#0b2a17}
.sres.bad{background:var(--bad);color:#2a0b06;animation:no .4s}
.nogl{display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;text-align:center}
@media (prefers-reduced-motion:reduce){.bub.pop,.beep,.win .bigok,.mentor.shake .face{animation:none}}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <button class="iconbtn" id="homeBtn" type="button" aria-label="단계 고르기"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></button>
    <div class="strip" id="strip" aria-label="수리 순서"></div>
    <div class="coin" aria-label="번 돈"><span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9l2 7 2-5 2 5 2-7M7 12h10"/></svg></span><b id="money">0</b></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="note" id="note" aria-label="손님 증상"></div>
    <div class="mentor" id="mentor">
      <svg class="face" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="35" r="23" fill="#f1c9a0"/>
        <path d="M9 31c0-14 10-22 23-22s23 8 23 22z" fill="#2f6fb5"/><rect x="7" y="28" width="38" height="6" rx="3" fill="#24558c"/>
        <circle cx="24" cy="39" r="2.6" fill="#2b241a"/><circle cx="40" cy="39" r="2.6" fill="#2b241a"/>
        <path d="M24 47q8 6 16 0" stroke="#2b241a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="bub" id="bub" aria-live="polite"></div>
    </div>
    <div class="beep" id="beep" hidden></div>

    <div class="over" id="menu"><div class="cards" id="cards"></div></div>

    <div class="over" id="win" hidden>
      <div class="win">
        <div class="bigok"><svg class="i" viewBox="0 0 24 24" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
        <div class="cause" id="winCause"></div>
        <div class="pay"><span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9l2 7 2-5 2 5 2-7M7 12h10"/></svg></span><b id="winPay"></b></div>
        <div class="row">
          <button class="bigbtn" id="winHome" type="button" aria-label="단계 고르기"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
          <button class="bigbtn go" id="winNext" type="button" aria-label="다음 단계"><svg class="i" viewBox="0 0 24 24" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>

    <div class="over" id="solder" hidden>
      <div class="solder">
        <div class="tool" id="sdTool"></div>
        <div class="heat"><div class="zone" id="sdZone"></div><div class="fill" id="sdFill"></div></div>
        <div class="sres" id="sdRes" hidden></div>
        <button class="hold" id="sdHold" type="button" aria-label="꾹 누르기"><svg class="i" viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 013 0v6M11 11V4a1.5 1.5 0 013 0v7M14 11V5a1.5 1.5 0 013 0v8c0 4-2 7-6 7s-6-2-7-5l-1.5-3a1.4 1.4 0 012.4-1.4L8 13"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);

/* ---------------- icons ---------------- */
const IC={
  plugOut:'<path d="M4 9h7v7H4z"/><path d="M6 9V5M9 9V5M7.5 16v4"/><path d="M14 12.5h7M18 9.5l3 3-3 3"/>',
  plugIn:'<path d="M13 9h7v7h-7z"/><path d="M15 9V5M18 9V5M16.5 16v4"/><path d="M3 12.5h7M7 9.5l3 3-3 3"/>',
  driver:'<path d="M14 3l7 7-3 3-7-7z"/><path d="M11 6l-7 7a2 2 0 000 3l1 1a2 2 0 003 0l7-7"/>',
  lift:'<path d="M12 20V8M7 12l5-5 5 5"/><path d="M4 4h16"/>',
  down:'<path d="M12 4v12M7 12l5 5 5-5"/><path d="M4 20h16"/>',
  tester:'<rect x="6" y="2" width="12" height="13" rx="2"/><path d="M9 6h6M9 9h3"/><path d="M9 15l-3 7M15 15l3 7"/>',
  look:'<circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L21 21"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>',
  box:'<path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/>',
  iron:'<path d="M2 22l5-5"/><path d="M7 17l3-3 4 4-3 3z"/><path d="M12 12l6-6a2.1 2.1 0 013 3l-6 6"/>',
  power:'<path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1011.4 0"/>',
  pick:'<path d="M5 3l7 14M19 3l-7 14M12 17v4"/>',
  spin:'<path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/>',
  dryer:'<path d="M2 6h13a4.5 4.5 0 010 9H9.5l1.2 6H6.5L5.5 15H2z"/><path d="M19.5 8v5"/>',
  fan:'<circle cx="12" cy="9" r="7"/><path d="M12 9l-3-5M12 9l5 2M12 9l-3 5M12 16v5M8 21h8"/>',
  kettle:'<path d="M6 8h11l1 12H5z"/><path d="M17 10c3 0 3 7 0 7M6 10L3 8M8 8V6h7v2"/>',
  wind:'<path d="M3 8h11a3 3 0 10-3-3M3 12h15a3 3 0 11-3 3M3 16h7"/>',
  flame:'<path d="M12 3c3 4 5 6 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
  slash:'<path d="M4 4l16 16" stroke="#d6402b" stroke-width="3"/>',
  hair:'<path d="M4 6c4-3 6 3 10 0s6 3 6 3M4 12c4-3 6 3 10 0s6 3 6 3M4 18c4-3 6 3 10 0"/>',
  weak:'<path d="M3 10h6M3 14h4"/><path d="M13 8l3 4-3 4M17 8l3 4-3 4" opacity=".35"/>',
  coil:'<path d="M3 12c1-4 2-4 3 0s2 4 3 0 2-4 3 0 2 4 3 0 2-4 3 0 2 4 3 0"/>',
  wire:'<path d="M3 15c4 0 4-6 8-6"/><circle cx="13" cy="9" r="2"/><path d="M17 9h4"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  beep:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 9a4 4 0 010 6M18.5 6a8 8 0 010 12"/>',
  mute:'<path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/>',
  no:'<path d="M6 6l12 12M18 6L6 18"/>',
};
const svg=(k,sw)=>`<svg class="i" viewBox="0 0 24 24"${sw?` stroke-width="${sw}"`:''}>${IC[k]}</svg>`;
const stack=(a,b)=>`<svg class="i" viewBox="0 0 24 24">${IC[a]}${IC[b]}</svg>`;

/* ---------------- save ---------------- */
const KEY='jeonpasa-3d-v1';
const P={money:0,done:[]};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){P.money=d.money||0;P.done=d.done||[];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
function showMoney(){$('#money').textContent=P.money.toLocaleString('ko-KR');}
showMoney();

/* ---------------- audio ---------------- */
let AC=null;
function tone(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.06;g.gain.setTargetAtTime(0,AC.currentTime+d*.7,d*.2);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

if(!window.THREE||!THREE.OrbitControls){$('#stage').innerHTML='<div class="nogl">3D를 불러오지 못했어요. 새로고침해 주세요.</div>';return;}
const W=THREE,V=(x,y,z)=>new W.Vector3(x,y,z);

/* ---------------- three setup ---------------- */
const canvas=$('#cv'),stageEl=$('#stage');
let renderer;
try{renderer=new W.WebGLRenderer({canvas,antialias:true});}catch(e){$('#stage').innerHTML='<div class="nogl">이 기기에서는 3D를 켤 수 없어요.</div>';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new W.Scene();scene.background=new W.Color('#16262d');
const camera=new W.PerspectiveCamera(40,1.6,.1,100);
const controls=new W.OrbitControls(camera,canvas);
controls.enablePan=false;controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.56;
scene.add(new W.HemisphereLight(0xffffff,0x3a4a55,.85));
const sun=new W.DirectionalLight(0xffffff,.75);sun.position.set(3,7,5);scene.add(sun);
const fillL=new W.PointLight(0xffe2c0,.5,12);fillL.position.set(-2,3,3);scene.add(fillL);

function mat(c,o){return new W.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.05},o||{}));}
function M_(g,m,parent,p,r){const x=new W.Mesh(g,m);if(p)x.position.set(p[0],p[1],p[2]);if(r)x.rotation.set(r[0],r[1],r[2]);if(parent)parent.add(x);return x;}

/* environment */
M_(new W.BoxGeometry(14,.2,7),mat('#7a5638',{roughness:.8}),scene,[0,-1.2,.6]);
M_(new W.BoxGeometry(14,.02,7),mat('#2a4a44',{roughness:.9}),scene,[0,-1.09,.6]);
M_(new W.PlaneGeometry(14,8),mat('#24363d',{roughness:1}),scene,[0,2.5,-2.5]);
const outlet=new W.Group();outlet.position.set(2.8,-.3,-2.47);scene.add(outlet);
M_(new W.BoxGeometry(.6,.8,.05),mat('#eceff1'),outlet);
[-.09,.09].forEach(x=>M_(new W.CylinderGeometry(.03,.03,.06,10),mat('#222'),outlet,[x,0,.02],[Math.PI/2,0,0]));

const boxG=new W.Group();boxG.position.set(2.9,-1.08,1.5);scene.add(boxG);
const cb=mat('#c78a4a',{roughness:.9});
M_(new W.BoxGeometry(1.1,.04,.8),cb,boxG,[0,.02,0]);
M_(new W.BoxGeometry(1.1,.36,.04),mat('#c78a4a'),boxG,[0,.2,.4]);
M_(new W.BoxGeometry(1.1,.36,.04),mat('#b97d40'),boxG,[0,.2,-.4]);
M_(new W.BoxGeometry(.04,.36,.8),mat('#b97d40'),boxG,[.55,.2,0]);
M_(new W.BoxGeometry(.04,.36,.8),mat('#c78a4a'),boxG,[-.55,.2,0]);
const boxContent=new W.Group();boxContent.position.set(0,.2,0);boxG.add(boxContent);

const tester=new W.Group();tester.position.set(-2.5,-.75,1.7);tester.rotation.set(-.5,.3,0);scene.add(tester);
M_(new W.BoxGeometry(.5,.75,.16),mat('#f0c12e'),tester);
M_(new W.BoxGeometry(.38,.22,.02),mat('#9fb08a'),tester,[0,.18,.09]);
M_(new W.CylinderGeometry(.09,.09,.04,20),mat('#222'),tester,[0,-.14,.09],[Math.PI/2,0,0]);
tester.visible=false;
const probeR=M_(new W.ConeGeometry(.05,.24,12),mat('#e0352b'),scene);probeR.visible=false;
const probeB=M_(new W.ConeGeometry(.05,.24,12),mat('#222'),scene);probeB.visible=false;

const plug=new W.Group();scene.add(plug);
M_(new W.BoxGeometry(.3,.24,.22),mat('#f2f2f0'),plug);
[-.07,.07].forEach(x=>M_(new W.CylinderGeometry(.022,.022,.18,8),mat('#c9cdd1',{metalness:.6}),plug,[x,0,-.18],[Math.PI/2,0,0]));
const PLUG_IN={p:V(2.8,-.3,-2.22),r:{x:0,y:0,z:0}},PLUG_OUT={p:V(2.0,-.97,-.9),r:{x:0,y:.7,z:0}};
let cordMesh=null;
function updateCord(){
  const end=plug.localToWorld(V(0,0,.12));
  const curve=new W.CatmullRomCurve3([V(.2,-.98,-.35),V(.5,-1.04,-.9),V(1.4,-1.04,-1.2),end]);
  if(cordMesh){scene.remove(cordMesh);cordMesh.geometry.dispose();}
  cordMesh=new W.Mesh(new W.TubeGeometry(curve,40,.04,6),cordMat);scene.add(cordMesh);
}
const cordMat=mat('#2a2d31');

const arrow=new W.Mesh(new W.ConeGeometry(.13,.32,16),new W.MeshBasicMaterial({color:0xffd84a,depthTest:false,transparent:true}));
arrow.rotation.x=Math.PI;arrow.renderOrder=999;scene.add(arrow);

/* particles for air */
const parts=[];
for(let i=0;i<46;i++){const m=new W.Mesh(new W.SphereGeometry(.05,8,6),new W.MeshBasicMaterial({color:0xff8a4c,transparent:true,opacity:0}));m.visible=false;scene.add(m);parts.push({m,life:0,v:V(0,0,0)});}

/* ---------------- picking registry ---------------- */
let pick=[],anchors={};
function tag(o,id){o.traverse(m=>{if(m.isMesh){m.userData.id=id;pick.push(m);}});}
function anchor(parent,id,p){const a=new W.Object3D();a.position.set(p[0],p[1],p[2]);parent.add(a);anchors[id]=a;}
function live(m){let o=m;while(o){if(!o.visible)return false;if(o===scene)return true;o=o.parent;}return false;}

/* ---------------- dryer model ---------------- */
const BODY='#3fb6a8',BACK='#1d564f';
let D=null;
function screw(axis){
  const o=new W.Group(),inner=new W.Group();o.add(inner);
  M_(new W.CylinderGeometry(.1,.1,.06,20),mat('#d5d9dc',{metalness:.6,roughness:.3}),inner);
  M_(new W.BoxGeometry(.15,.02,.03),mat('#5d656b'),inner,[0,.032,0]);
  M_(new W.BoxGeometry(.03,.02,.15),mat('#5d656b'),inner,[0,.032,0]);
  if(axis==='z')o.rotation.x=Math.PI/2;else o.rotation.z=Math.PI/2;
  o.userData.inner=inner;o.userData.dir=axis==='z'?V(0,0,1):V(-1,0,0);return o;
}
function makeHeater(broken,fresh){
  const g=new W.Group();
  M_(new W.BoxGeometry(1.94,.5,.03),mat('#d9c89c',{roughness:.85}),g);
  M_(new W.BoxGeometry(1.94,.03,.5),mat('#d2c092',{roughness:.85}),g);

const tweens=[];
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done});}
function moveTo(o,pos,rot,dur,done){
  const p0=o.position.clone(),r0={x:o.rotation.x,y:o.rotation.y,z:o.rotation.z};
  tween(dur,e=>{o.position.lerpVectors(p0,pos,e);if(rot){o.rotation.x=r0.x+(rot.x-r0.x)*e;o.rotation.y=r0.y+(rot.y-r0.y)*e;o.rotation.z=r0.z+(rot.z-r0.z)*e;}},done);
}
const CAM={
  home:{p:V(.6,2.7,8.4),t:V(.3,.5,0)},
  inside:{p:V(.45,1.9,4.7),t:V(.35,1.05,0)},
  coil:{p:V(.4,1.85,1.75),t:V(.35,1.5,0)},
  sw:{p:V(.75,.95,1.6),t:V(.3,.45,.1)},
  back:{p:V(-6.4,2.6,3.4),t:V(-1,.7,.2)},
  fan:{p:V(-3.4,1.9,.9),t:V(-1.2,1.5,0)},
};
let camKey=null;
function camTo(k,done){
  if(camKey===k){done&&done();return;}camKey=k;
  const c=CAM[k],p0=camera.position.clone(),t0=controls.target.clone();
  tween(.9,e=>{camera.position.lerpVectors(p0,c.p,e);controls.target.lerpVectors(t0,c.t,e);},done);
}

/* ---------------- game state ---------------- */
const G={stage:-1,steps:null,i:0,pend:null,probes:[],busy:true,on:false};

function fillBox(kind){
  while(boxContent.children.length)boxContent.remove(boxContent.children[0]);
  boxContent.visible=true;
  if(kind==='heater'){
    const keep=Object.assign({},anchors);
    const h=makeHeater(false,true);h.scale.setScalar(.4);h.traverse(m=>{if(m.isMesh)m.userData.id='box';});boxContent.add(h);
    anchors=keep;
  }
}

function startStage(n){
  G.stage=n;const S=STAGES[n];
  buildDryer(S.cfg);
  fillBox(S.boxIcon);
  if(!S.boxIcon)boxContent.visible=false;
  plug.position.copy(PLUG_IN.p);plug.rotation.set(0,0,0);
  G.steps=S.steps;G.i=0;G.on=false;G.busy=false;
  parts.forEach(p=>{p.life=0;p.m.visible=false;});
  $('#note').innerHTML=`<span>${svg('dryer')}</span><span>${stack(S.sym[0],S.sym[1])}</span>`;
  $('#menu').hidden=true;$('#win').hidden=true;
  camKey=null;camera.position.copy(CAM.home.p);controls.target.copy(CAM.home.t);camKey='home';
  setupStep();
}
function setupStep(){
  const st=G.steps[G.i];G.probes=[];probeR.visible=probeB.visible=false;
  G.pend=st.act==='multi'?new Set(st.ids):null;
  tester.visible=st.act==='tester';
  if(st.cam){G.busy=true;camTo(st.cam,()=>{G.busy=false;});}
  renderHud();
}
function activeIds(){
  if(G.busy||!G.steps||!G.steps[G.i])return[];
  const st=G.steps[G.i];
  if(st.act==='multi')return[...G.pend];
  if(st.act==='tester')return[st.ids[G.probes.length]];
  return st.ids;
}
function renderHud(){
  $('#strip').innerHTML=G.steps.map((s,k)=>`<div class="st ${k<G.i?'done':k===G.i?'now':''}">${svg(k<G.i?'check':s.ic,k<G.i?3:2)}</div>`).join('');
  const strip=$('#strip'),now=strip.children[G.i];if(now)strip.scrollLeft=now.offsetLeft-strip.clientWidth/2+now.clientWidth/2-strip.offsetLeft;
  const b=$('#bub');b.innerHTML=G.steps[G.i]?svg(G.steps[G.i].ic):svg('check',3);
  b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
}
function nudge(){
  const m=$('#mentor');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');tone(160,.18,'square',.04);
}
function next(){
  G.i++;
  if(G.i>=G.steps.length){finish();return;}
  tone(660,.06);setupStep();
}
function handle(id){
  if(G.busy)return;
  const act=activeIds();
  if(!id||!act.includes(id)){nudge();return;}
  const st=G.steps[G.i];
  if(st.act==='tap'){G.busy=true;tone(560,.05);st.run(()=>{G.busy=false;next();});}
  else if(st.act==='multi'){G.busy=true;G.pend.delete(id);st.run1(id,()=>{G.busy=false;if(!G.pend.size)next();else renderHud();});}
  else if(st.act==='tester'){
    const a=anchors[id].getWorldPosition(V(0,0,0)),pr=G.probes.length?probeB:probeR;
    pr.position.copy(a).add(V(0,.16,.08));pr.rotation.set(Math.PI,0,0);pr.visible=true;G.probes.push(id);tone(800,.04);
    if(G.probes.length===2){
      G.busy=true;
      setTimeout(()=>{
        const bp=$('#beep');bp.hidden=false;bp.className='beep '+(st.beep?'yes':'no');bp.innerHTML=svg(st.beep?'beep':'mute',2.4);
        if(st.beep)tone(2600,.7,'square',.05);else tone(120,.15,'sine',.03);
        setTimeout(()=>{bp.hidden=true;G.busy=false;next();},1500);
      },350);
    }
  }
  else if(st.act==='solder'){G.busy=true;solder(()=>{st.run(()=>{G.busy=false;next();});});}
}
function finish(){
  G.busy=true;$('#bub').innerHTML=svg('check',3);
  const S=STAGES[G.stage],first=!P.done.includes(G.stage),pay=first?S.fee:Math.round(S.fee/2);
  P.money+=pay;if(first)P.done.push(G.stage);save();showMoney();
  tone(880,.15);setTimeout(()=>tone(1320,.25),160);
  renderHud();
  setTimeout(()=>{
    $('#winCause').innerHTML=`<span>${svg(S.cause[0])}</span><span>${svg('check',3)}</span>`;
    $('#winPay').textContent='+'+pay.toLocaleString('ko-KR');
    $('#winNext').hidden=G.stage>=STAGES.length-1;
    $('#win').hidden=false;
  },600);
}

const SD={on:false,hold:false,heat:0,z0:42,z1:78,cb:null,last:0,lock:false};

function solder(cb){
  Object.assign(SD,{on:true,hold:false,heat:0,cb,lock:false});
  $('#sdZone').style.left=SD.z0+'%';$('#sdZone').style.width=(SD.z1-SD.z0)+'%';$('#sdRes').hidden=true;
  $('#solder').hidden=false;SD.last=performance.now();requestAnimationFrame(sdTick);
}
function sdTick(t){if(!SD.on)return;const dt=t-SD.last;SD.last=t;
  if(SD.hold){SD.heat=Math.min(100,SD.heat+dt/26);if(SD.heat>=100)sdRelease();}
  $('#sdFill').style.width=SD.heat+'%';$('#sdHold').classList.toggle('active',SD.hold);requestAnimationFrame(sdTick);}
function sdPress(){if(SD.on&&!SD.lock){SD.hold=true;$('#sdRes').hidden=true;}}
function sdRelease(){
  if(!SD.on||!SD.hold)return;SD.hold=false;const h=SD.heat,r=$('#sdRes');r.hidden=false;
  if(h>=SD.z0&&h<=SD.z1){r.className='sres ok';r.innerHTML=svg('check',3);SD.lock=true;tone(1200,.1);
    setTimeout(()=>{SD.on=false;$('#solder').hidden=true;const c=SD.cb;SD.cb=null;c&&c();},700);}
  else{r.className='sres bad';r.innerHTML=svg('no',3);tone(150,.2,'square',.04);SD.heat=0;}
}
const hb=$('#sdHold');
hb.addEventListener('pointerdown',e=>{e.preventDefault();hb.setPointerCapture&&hb.setPointerCapture(e.pointerId);sdPress();});
hb.addEventListener('pointerup',sdRelease);hb.addEventListener('pointercancel',sdRelease);
hb.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(!$('#solder').hidden&&e.code==='Space'){e.preventDefault();if(!e.repeat)sdPress();}});
document.addEventListener('keyup',e=>{if(!$('#solder').hidden&&e.code==='Space'){e.preventDefault();sdRelease();}});

/* ---------------- picking ---------------- */
const ray=new W.Raycaster(),ndc=new W.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>7)return;
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pick.filter(live),false);
  const act=activeIds();
  const h=hits.find(x=>act.includes(x.object.userData.id))||hits[0];
  handle(h?h.object.userData.id:null);
});

/* ---------------- loop ---------------- */
function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const clock=new W.Clock();let prevAct=[];
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(ease(k));if(k>=1){tweens.splice(i,1);tw.done&&tw.done();}}
  updateCord();
  const act=activeIds(),k=.22+.22*Math.sin(t*6);
  pick.forEach(m=>{if(m.material&&m.material.emissive){if(act.includes(m.userData.id))m.material.emissive.setRGB(k*1.1,k*.85,0);else m.material.emissive.setRGB(0,0,0);}});
  if(act.length&&anchors[act[0]]){arrow.visible=true;const a=anchors[act[0]].getWorldPosition(V(0,0,0));arrow.position.set(a.x,a.y+.42+Math.sin(t*5)*.08,a.z);}
  else arrow.visible=false;
  if(G.on){
    D.fan.rotation.x+=dt*28;
    const hot=true;
    parts.forEach(p=>{
      if(p.life<=0&&Math.random()<.35){p.life=.9;p.m.visible=true;p.m.position.set(2.32,1.5+(Math.random()-.5)*.8,(Math.random()-.5)*.8);p.v.set(3+Math.random()*1.5,(Math.random()-.5)*.6,(Math.random()-.5)*.6);
        p.m.material.color.set(hot?(Math.random()<.5?0xff8a4c:0xffc070):0xbfe6ff);}
      if(p.life>0){p.life-=dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.life);p.m.scale.setScalar(1+(.9-p.life)*2);if(p.life<=0)p.m.visible=false;}
    });
  }
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}

/* boot: show menu with first stage built behind it */
resize();startStage(0);openMenu();
camera.position.copy(CAM.home.p);controls.target.copy(CAM.home.t);
loop();
})();
</script>
